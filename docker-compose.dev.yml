# Docker Compose for local development
# Start with: docker compose -f docker-compose.dev.yml up
# Or use: pnpm docker:dev

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: turbo-postgres-dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-54322}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dev-network

  # Express API Server (Development with hot reload)
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
      target: dev
    container_name: turbo-api-dev
    ports:
      - "${API_PORT:-3002}:3002"
    environment:
      - NODE_ENV=development
      - API_PORT=${API_PORT:-3002}
      - SUPABASE_URL=${SUPABASE_URL:-http://host.docker.internal:54321}
      - SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY:-}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY:-}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      - SUPABASE_AUTH_JWT_SECRET=${SUPABASE_AUTH_JWT_SECRET:-super-secret-jwt-token-for-dev}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-postgres}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3001,http://localhost:3000}
      - LOG_LEVEL=${LOG_LEVEL:-debug}
    volumes:
      - ./apps/api/src:/app/apps/api/src:ro
      - ./packages/helpers/src:/app/packages/helpers/src:ro
      - ./packages/logger/src:/app/packages/logger/src:ro
      - ./packages/api-types/src:/app/packages/api-types/src:ro
      - ./packages/db-schema/src:/app/packages/db-schema/src:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dev-network

  # Nuxt Frontend (Development with HMR)
  nuxt:
    build:
      context: .
      dockerfile: apps/nuxt/Dockerfile.dev
      target: dev
    container_name: turbo-nuxt-dev
    ports:
      - "${NUXT_PORT:-3001}:3001"
    environment:
      - NODE_ENV=development
      - PORT=${NUXT_PORT:-3001}
      - NUXT_PUBLIC_API_BASE=http://localhost:${API_PORT:-3002}
    volumes:
      - ./apps/nuxt:/app/apps/nuxt:ro
      - ./packages/ui/src:/app/packages/ui/src:ro
      - /app/apps/nuxt/node_modules
      - /app/apps/nuxt/.nuxt
    depends_on:
      - api
    networks:
      - dev-network

networks:
  dev-network:
    driver: bridge

volumes:
  postgres_dev_data:
    driver: local
