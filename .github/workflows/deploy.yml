name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      services:
        description: 'Services to deploy (comma-separated: api,nuxt,docus or "all")'
        required: false
        default: 'all'
        type: string

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  GCP_REGION: ${{ secrets.GCP_REGION || 'europe-west1' }}
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REPOSITORY: turbo-repo

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      nuxt: ${{ steps.filter.outputs.nuxt }}
      docus: ${{ steps.filter.outputs.docus }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/helpers/**'
              - 'packages/logger/**'
              - 'packages/api-types/**'
              - 'packages/db-schema/**'
            nuxt:
              - 'apps/nuxt/**'
              - 'packages/ui/**'
              - 'packages/tailwind-config/**'
            docus:
              - 'apps/docus/**'

  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.api == 'true' || needs.changes.outputs.nuxt == 'true' || needs.changes.outputs.docus == 'true'
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine services to deploy
        id: services
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            INPUT="${{ github.event.inputs.services }}"
            if [ "$INPUT" == "all" ]; then
              echo "api=true" >> $GITHUB_OUTPUT
              echo "nuxt=true" >> $GITHUB_OUTPUT
              echo "docus=true" >> $GITHUB_OUTPUT
            else
              echo "api=$([[ $INPUT == *api* ]] && echo true || echo false)" >> $GITHUB_OUTPUT
              echo "nuxt=$([[ $INPUT == *nuxt* ]] && echo true || echo false)" >> $GITHUB_OUTPUT
              echo "docus=$([[ $INPUT == *docus* ]] && echo true || echo false)" >> $GITHUB_OUTPUT
            fi
          else
            echo "api=${{ needs.changes.outputs.api }}" >> $GITHUB_OUTPUT
            echo "nuxt=${{ needs.changes.outputs.nuxt }}" >> $GITHUB_OUTPUT
            echo "docus=${{ needs.changes.outputs.docus }}" >> $GITHUB_OUTPUT
          fi

      # Build and push API
      - name: Build and push API
        if: steps.services.outputs.api == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/api:${{ github.sha }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy API to Cloud Run
        if: steps.services.outputs.api == 'true'
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: turbo-api
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/api:${{ github.sha }}

      # Build and push Nuxt
      - name: Build and push Nuxt
        if: steps.services.outputs.nuxt == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/nuxt/Dockerfile
          push: true
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/nuxt:${{ github.sha }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/nuxt:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy Nuxt to Cloud Run
        if: steps.services.outputs.nuxt == 'true'
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: turbo-nuxt
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/nuxt:${{ github.sha }}

      # Build and push Docus
      - name: Build and push Docus
        if: steps.services.outputs.docus == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/docus/Dockerfile
          push: true
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/docus:${{ github.sha }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/docus:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy Docus to Cloud Run
        if: steps.services.outputs.docus == 'true'
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: turbo-docus
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/docus:${{ github.sha }}

      - name: Output deployment URLs
        run: |
          echo "## Deployment Complete! :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.services.outputs.api }}" == "true" ]; then
            echo "- **API**: https://turbo-api-xxxxx.run.app" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ steps.services.outputs.nuxt }}" == "true" ]; then
            echo "- **Nuxt**: https://turbo-nuxt-xxxxx.run.app" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ steps.services.outputs.docus }}" == "true" ]; then
            echo "- **Docus**: https://turbo-docus-xxxxx.run.app" >> $GITHUB_STEP_SUMMARY
          fi
